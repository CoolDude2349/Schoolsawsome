<script>

let db = 0

function loadResource(event) {

if (db === 0) {
db = 1
}


let doc = document


const checkbox = document.getElementById("checkbox")

if (checkbox.checked) {


const buttons = document.querySelectorAll('button');
      buttons.forEach(button => {
        button.remove() })
        document.head.innerHTML = ""
         document.body.innerHTML = ""
       const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '100vh'; 
            iframe.style.border = 'none'; 

           
            document.body.appendChild(iframe);
            iframe.focus()
            
           // iframe.scrolling = "no"
            
             document.body.style.overflow = 'hidden';

                         var iframePosition = iframe.getBoundingClientRect().top + window.scrollY;
            
            
            window.scrollTo({
                top: iframePosition,
                behavior: 'smooth'  
            });
             
           

         
            doc = iframe.contentWindow.document;
            
            }
            
      let fileName = event.target.name

let url = "https://cdn.jsdelivr.net/gh/CoolDude2349/Schoolsawsome@main/" + fileName + ".html"
console.log(url)

fetch(url)
            .then(response => response.text())
            .then(html => {
                
                doc.open();
                doc.write(html);
                doc.close();
            })
            .catch(error => console.error("Error loading HTML:", error));


    }

   
    window.onload = function() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(button => {
        button.addEventListener('click', loadResource);
      });
    };
    
    
 let container = document.getElementById("button-container");
      let divButtons = Array.from(container.getElementsByTagName("button"));
      
      divButtons.sort((a, b) => {
        
        let textA = a.textContent.trim()[0].toUpperCase();
        let textB = b.textContent.trim()[0].toUpperCase();
        
     
        return textA.localeCompare(textB);
      });

     
      container.innerHTML = "";
      divButtons.forEach(button => {
        container.appendChild(button);
      });
</script>
