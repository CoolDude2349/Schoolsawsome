<script>

let db = 0

function loadResource(event) {

if (db === 0) {
db = 1
}

const buttons = document.querySelectorAll('button');
      buttons.forEach(button => {
        button.remove() })
      
      let fileName = event.target.name

let url = "https://cdn.jsdelivr.net/gh/CoolDude2349/Schoolsawsome@main/" + fileName + ".html"
console.log(url)

fetch(url)
            .then(response => response.text())
            .then(html => {
                const doc = document
                doc.open();
                doc.write(html);
                doc.close();
            })
            .catch(error => console.error("Error loading HTML:", error));


    }

    // Adding event listeners to buttons
    window.onload = function() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(button => {
        button.addEventListener('click', loadResource);
      });
    };
</script>
